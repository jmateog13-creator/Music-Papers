<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mots Amagats · The Aulatech Daily</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:wght@700;900&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/newspaper.css" />
  <link rel="stylesheet" href="css/landing.css" />
  <link rel="stylesheet" href="css/games.css" />
  <link rel="stylesheet" href="css/dev-toolbar.css" />
</head>
<body data-game="mots-amagats">

  <div id="dev-toolbar" class="dev-toolbar" hidden>
    <span class="dev-toolbar__brand">▣ EDICIÓ PILOT · DEV TOOLS</span>
    <span class="dev-toolbar__active" id="dev-toolbar-active">cap joc actiu</span>
    <button data-dev-action="autosolve">⚙ Auto-resol</button>
    <button data-dev-action="reset">↻ Reinicia partida</button>
    <button data-dev-action="clear-progress">⊘ Reset progrés</button>
    <button data-dev-action="back">← Tornar a portada</button>
    <button data-dev-action="hide" class="dev-toolbar__close">✕</button>
  </div>

  <div id="game-landing" class="game-landing">
    <a class="game-landing__back" href="index.html">← Tornar al diari</a>
    <div class="game-landing__inner">
      <span class="game-landing__icon" id="landing-icon"></span>
      <h2 class="game-landing__title" id="landing-title"></h2>
      <p class="game-landing__pitch" id="landing-pitch"></p>
      <div class="game-landing__context" id="landing-context"></div>
      <div class="game-landing__actions">
        <button class="btn btn--primary" data-action="play">▶ JUGAR</button>
        <button class="btn btn--ghost" data-action="tutorial">? TUTORIAL INTERACTIU</button>
      </div>
      <div class="game-landing__meta" id="landing-meta"></div>
    </div>
  </div>

  <div id="game-stage" class="game-stage" hidden>
    <header class="game-stage__bar">
      <button class="game-stage__back" data-action="back-to-landing">← Sortir</button>
      <h3 class="game-stage__title" id="stage-title"></h3>
      <div class="game-stage__hud" id="stage-hud"></div>
    </header>
    <div class="game-stage__board" id="game-board"></div>
  </div>

  <div id="tutorial-overlay" class="tutorial-overlay" hidden>
    <div class="tutorial-overlay__veil"></div>
    <div class="tutorial-overlay__spotlight" id="tutorial-spotlight"></div>
    <div class="tutorial-overlay__card" id="tutorial-card">
      <span class="tutorial-overlay__step" id="tutorial-step">Pas 1/3</span>
      <p class="tutorial-overlay__text" id="tutorial-text"></p>
      <div class="tutorial-overlay__actions">
        <button class="btn btn--ghost btn--small" data-action="tutorial-skip">Saltar tutorial</button>
        <button class="btn btn--primary btn--small" data-action="tutorial-next">Següent →</button>
      </div>
    </div>
  </div>

  <div id="victory-modal" class="victory-modal" hidden>
    <div class="victory-modal__card">
      <span class="victory-modal__seal">★</span>
      <h3 class="victory-modal__title">ENHORABONA!</h3>
      <p class="victory-modal__text" id="victory-text">Heu resolt el passatemps amb mestria.</p>
      <div class="victory-modal__actions">
        <button class="btn btn--ghost" data-action="back-to-front">↩ Tornar a portada</button>
        <button class="btn btn--primary" data-action="reset">↻ Una altra partida</button>
      </div>
    </div>
  </div>

  <script src="js/core/pentagrama.js?v=2"></script>
  <script src="js/core/tutorial.js?v=2"></script>
  <script src="js/core/dev-toolbar.js?v=2"></script>
  <script src="js/games/mots-amagats.js?v=2"></script>
  <script src="js/bridge.js"></script>
  <script src="js/main-game.js?v=2"></script>

</body>
</html>
